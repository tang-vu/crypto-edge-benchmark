name: Ingestion CLI tests

on:
  pull_request:
    paths:
      - benchmark/analysis/ingest-r1-revision.py
      - benchmark/analysis/tests/**
      - .github/workflows/ingestion-cli.yml
  push:
    branches: [main]
    paths:
      - benchmark/analysis/ingest-r1-revision.py
      - benchmark/analysis/tests/**
      - .github/workflows/ingestion-cli.yml

permissions:
  contents: read

jobs:
  ingestion-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /benchmark/analysis/ingest-r1-revision.py
            /benchmark/analysis/tests/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test environment
        run: python -m pip install pandas==2.2.3 numpy==2.3.5
      - name: Test CLI with temporary synthetic inputs
        run: python -m unittest discover -s benchmark/analysis/tests -v
